<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Drawer not found — Cabinet of Curiosities</title><style>body{margin:0;padding:12vh 9vw;background:#182c4c;color:#f0e5cc;font:20px/1.6 Georgia,serif}h1{font-size:clamp(40px,7vw,80px);font-weight:400;max-width:800px}a{color:#79b9b1}select{background:#10213a;color:#f0e5cc;border:1px solid #c7a465;padding:9px;font:14px sans-serif}</style></head><body><select id="language" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option></select><h1>This drawer is not here.</h1><p>Choose another object from the collection.</p><a id="home" href="https://kulieff21.github.io/merak-kabinesi/">Back to the collection</a><script type="module">
const base = location.hostname.endsWith('.github.io') ? '/' + location.pathname.split('/')[1] + '/' : '/';
const { setLanguage, resolveLanguage, rememberLanguage, getLanguage, t } = await import(base + 'src/i18n.js');
let storage; try { storage = localStorage; } catch {}
setLanguage(resolveLanguage(location.search, storage));
function render() { document.documentElement.lang = getLanguage(); document.title = t('Drawer not found — Cabinet of Curiosities'); document.querySelector('h1').textContent = t('This drawer is not here.'); document.querySelector('p').textContent = t('Choose another object from the collection.'); document.querySelector('#home').textContent = t('Back to the collection'); document.querySelector('#home').href = base + (getLanguage() === 'tr' ? '?lang=tr' : '') + '#/collection'; document.querySelector('#language').value = getLanguage(); document.querySelector('#language').setAttribute('aria-label',t('Language')); }
document.querySelector('#language').addEventListener('change', event => { setLanguage(event.target.value); rememberLanguage(storage, getLanguage()); const url = new URL(location.href); if (getLanguage() === 'tr') url.searchParams.set('lang', 'tr'); else url.searchParams.delete('lang'); history.replaceState(null, '', url); render(); }); render();
</script></body></html>
